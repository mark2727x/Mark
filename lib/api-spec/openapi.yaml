openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ShiftGuard lifeguard marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session
  - name: shifts
    description: Shift listings
  - name: applications
    description: Shift pickup / applications
  - name: users
    description: User profiles
  - name: ratings
    description: Ratings and reviews
  - name: payments
    description: Stripe payments and payouts

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user (lifeguard or pool manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-certificate:
    post:
      operationId: verifyCertificate
      tags: [auth]
      summary: Verify a lifeguard certificate with its issuing association
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCertificateInput"
      responses:
        "200":
          description: Certificate lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateVerificationResponse"
        "400":
          description: Invalid certificate details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address with a one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Verified and authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Generate a replacement verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationInput"
      responses:
        "200":
          description: Code requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  verificationRequired:
                    type: boolean
                  email:
                    type: string
                  verificationCode:
                    type: [string, "null"]

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Shifts ──────────────────────────────────────────────────────────────────
  /shifts:
    get:
      operationId: listShifts
      tags: [shifts]
      summary: Browse open shifts (lifeguard feed)
      parameters:
        - name: certification
          in: query
          schema:
            type: string
          description: Filter by required certification (e.g. "Lifeguard", "WSI")
        - name: minPay
          in: query
          schema:
            type: number
          description: Minimum hourly pay rate
        - name: location
          in: query
          schema:
            type: string
          description: Free-text location search
        - name: status
          in: query
          schema:
            type: string
            enum: [open, filled, completed, cancelled]
          description: Filter by shift status (default open)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"
    post:
      operationId: createShift
      tags: [shifts]
      summary: Post a new shift (pool manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only pool managers can post shifts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shifts/{id}:
    get:
      operationId: getShift
      tags: [shifts]
      summary: Get a single shift with full details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateShift
      tags: [shifts]
      summary: Update a shift (owning manager only, only when open)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteShift
      tags: [shifts]
      summary: Cancel/delete a shift (owning manager only, only when open)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shifts/{id}/pickup:
    post:
      operationId: pickupShift
      tags: [applications]
      summary: Lifeguard picks up an open shift
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Shift picked up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          description: Shift not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only lifeguards can pick up shifts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shifts/{id}/complete:
    post:
      operationId: completeShift
      tags: [applications]
      summary: Pool manager marks shift as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Shift completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shifts/{id}/drop:
    post:
      operationId: dropShift
      tags: [applications]
      summary: Lifeguard drops a shift they previously picked up
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Shift dropped, status reverts to open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── User Profile ─────────────────────────────────────────────────────────────
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user's public profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me:
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/shifts:
    get:
      operationId: getUserShifts
      tags: [users]
      summary: List shifts posted by (manager) or worked by (lifeguard) a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"

  /users/me/earnings:
    get:
      operationId: getMyEarnings
      tags: [payments]
      summary: Earnings dashboard for the authenticated lifeguard
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarningsSummary"
        "403":
          description: Only lifeguards have earnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Ratings ──────────────────────────────────────────────────────────────────
  /ratings:
    post:
      operationId: createRating
      tags: [ratings]
      summary: Submit a rating after a completed shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already rated this shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/ratings:
    get:
      operationId: getUserRatings
      tags: [ratings]
      summary: Get ratings received by a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rating"

  # ── Payments ────────────────────────────────────────────────────────────────
  /payments/config:
    get:
      operationId: getPaymentsConfig
      tags: [payments]
      summary: Publishable Stripe config for the frontend
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsConfig"

  /payments/checkout:
    post:
      operationId: createCheckoutSession
      tags: [payments]
      summary: Create a Stripe Checkout session for a shift (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutSessionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/status/{sessionId}:
    get:
      operationId: getPaymentStatus
      tags: [payments]
      summary: Poll status of a Stripe Checkout session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connect/onboarding-link:
    post:
      operationId: createConnectOnboardingLink
      tags: [payments]
      summary: Create a Stripe Connect onboarding link (lifeguard only)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectOnboardingInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectOnboardingResponse"

  /connect/status:
    get:
      operationId: getConnectStatus
      tags: [payments]
      summary: Get Stripe Connect onboarding status for the current lifeguard
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectStatus"

  /shifts/{id}/payout:
    post:
      operationId: payoutShift
      tags: [payments]
      summary: Transfer funds to the lifeguard for a completed shift (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    # ── Core ──────────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Auth ──────────────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [email, password, name, role, phone]
      properties:
        email:
          type: string
        phone:
          type: string
          minLength: 10
          description: Phone number used for contact after a shift is picked up
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 2
        role:
          type: string
          enum: [lifeguard, manager]
        certifications:
          type: ["array", "null"]
          items:
            type: string
          description: Certifications the lifeguard holds (e.g. ["Lifeguard", "CPR/AED", "WSI"])
        zelleId:
          type: ["string", "null"]
          description: Zelle phone/email for payment
        bio:
          type: ["string", "null"]
        certificateAssociation:
          type: ["string", "null"]
          description: Issuing association for a lifeguard certificate
        certificateType:
          type: ["string", "null"]
          description: Certificate type, for example Lifeguarding
        certificateNumber:
          type: ["string", "null"]
          description: Certificate number or ID from the issuing association

    VerifyCertificateInput:
      type: object
      required: [association, certificateType, certificateNumber]
      properties:
        association:
          type: string
        certificateType:
          type: string
        certificateNumber:
          type: string

    CertificateVerificationResponse:
      type: object
      required: [verified, association, certificateType, certificateNumber]
      properties:
        verified:
          type: boolean
        association:
          type: string
        certificateType:
          type: string
        certificateNumber:
          type: string
        verificationUrl:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          
        password:
          type: string

    VerifyEmailInput:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6

    ResendVerificationInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    RegistrationResponse:
      type: object
      required: [verificationRequired, email]
      properties:
        verificationRequired:
          type: boolean
        email:
          type: string
        verificationCode:
          type: [string, "null"]
          description: Development-only code when no email provider is connected

    # ── Users ─────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, email, name, ratingAvg, ratingCount, createdAt]
      properties:
        id:
          type: number
        email:
          type: string
        phone:
          type: string
          description: Present for the authenticated user and assigned shift participants only
        name:
          type: string
        role:
          type: ["string", "null"]
          enum: [lifeguard, manager, null]
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        certifications:
          type: ["array", "null"]
          items:
            type: string
        zelleId:
          type: ["string", "null"]
        ratingAvg:
          type: number
        ratingCount:
          type: number
        createdAt:
          type: string
          format: date-time
        certificateAssociation:
          type: ["string", "null"]
        certificateType:
          type: ["string", "null"]
        certificateVerifiedAt:
          type: ["string", "null"]
          format: date-time
        stripeConnectOnboarded:
          type: boolean
        stripeConnectAccountId:
          type: ["string", "null"]

    UserUpdate:
      type: object
      properties:
        phone:
          type: string
          minLength: 10
        name:
          type: string
          minLength: 2
        bio:
          type: string
        certifications:
          type: array
          items:
            type: string
        zelleId:
          type: string

    # ── Shifts ────────────────────────────────────────────────────────────────
    Shift:
      type: object
      required:
        - id
        - title
        - location
        - payRate
        - totalHours
        - startTime
        - certificationRequired
        - description
        - rules
        - status
        - managerId
        - createdAt
      properties:
        id:
          type: number
        title:
          type: string
        location:
          type: string
          description: Exact street address, city, state, and ZIP code
        payRate:
          type: number
          description: Hourly pay in USD
        totalHours:
          type: number
        startTime:
          type: string
          format: date-time
        certificationRequired:
          type: string
          description: e.g. "Lifeguard", "WSI", "CPR/AED"
        description:
          type: string
        rules:
          type: string
          description: Rules and requirements set by the employer
        status:
          type: string
          enum: [open, filled, completed, cancelled]
        paymentStatus:
          type: string
          enum: [unpaid, paid, refunded, payout_pending, paid_out]
        managerId:
          type: number
        manager:
          $ref: "#/components/schemas/User"
        workerId:
          type: ["number", "null"]
        worker:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        managerContact:
          oneOf:
            - $ref: "#/components/schemas/Contact"
            - type: "null"
        workerContact:
          oneOf:
            - $ref: "#/components/schemas/Contact"
            - type: "null"
        createdAt:
          type: string
          format: date-time

    ShiftInput:
      type: object
      required:
        - title
        - location
        - payRate
        - totalHours
        - startTime
        - certificationRequired
        - description
        - rules
      properties:
        title:
          type: string
        location:
          type: string
          minLength: 10
          description: Exact street address, city, state, and ZIP code
        payRate:
          type: number
        totalHours:
          type: number
        startTime:
          type: string
          format: date-time
        certificationRequired:
          type: string
        description:
          type: string
        rules:
          type: string

    ShiftUpdate:
      type: object
      properties:
        title:
          type: string
        location:
          type: string
          minLength: 10
        payRate:
          type: number
        totalHours:
          type: number
        startTime:
          type: string
          format: date-time
        certificationRequired:
          type: string
        description:
          type: string
        rules:
          type: string

    # ── Ratings ───────────────────────────────────────────────────────────────
    Contact:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
        phone:
          type: string

    Rating:
      type: object
      required: [id, raterId, rateeId, shiftId, score, createdAt]
      properties:
        id:
          type: number
        raterId:
          type: number
        rater:
          $ref: "#/components/schemas/User"
        rateeId:
          type: number
        ratee:
          $ref: "#/components/schemas/User"
        shiftId:
          type: number
        score:
          type: number
          minimum: 1
          maximum: 5
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    RatingInput:
      type: object
      required: [rateeId, shiftId, score]
      properties:
        rateeId:
          type: number
        shiftId:
          type: number
        score:
          type: number
          minimum: 1
          maximum: 5
        comment:
          type: string


    # ── Payments ──────────────────────────────────────────────────────────────
    PaymentsConfig:
      type: object
      required: [publishableKey, platformFeeBps]
      properties:
        publishableKey:
          type: ["string", "null"]
        platformFeeBps:
          type: number
        managerFeeBps:
          type: number
        lifeguardFeeBps:
          type: number

    CheckoutSessionInput:
      type: object
      required: [shift_id, origin_url]
      properties:
        shift_id:
          type: number
        origin_url:
          type: string

    CheckoutSessionResponse:
      type: object
      required: [session_id]
      properties:
        checkout_url:
          type: ["string", "null"]
        session_id:
          type: string

    PaymentStatus:
      type: object
      required: [session_id, status, payment_status, amount_cents, currency, shift_id]
      properties:
        session_id:
          type: string
        status:
          type: string
          enum: [initiated, completed, failed, expired, refunded]
        payment_status:
          type: string
          enum: [pending, paid, failed, expired, refunded]
        amount_cents:
          type: number
        currency:
          type: string
        shift_id:
          type: number

    ConnectOnboardingInput:
      type: object
      properties:
        origin_url:
          type: string

    ConnectOnboardingResponse:
      type: object
      required: [url, accountId]
      properties:
        url:
          type: string
        accountId:
          type: string

    ConnectStatus:
      type: object
      required: [hasAccount, onboarded]
      properties:
        hasAccount:
          type: boolean
        onboarded:
          type: boolean
        chargesEnabled:
          type: boolean
        payoutsEnabled:
          type: boolean
        detailsSubmitted:
          type: boolean

    PayoutResponse:
      type: object
      required: [transferId, amountCents, platformFeeCents]
      properties:
        transferId:
          type: string
        amountCents:
          type: number
        platformFeeCents:
          type: number

    EarningsLineItem:
      type: object
      required: [shiftId, title, startTime, status, paymentStatus, grossCents, platformFeeCents, netCents]
      properties:
        shiftId:
          type: number
        title:
          type: string
        startTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [open, filled, completed, cancelled]
        paymentStatus:
          type: string
          enum: [unpaid, paid, refunded, payout_pending, paid_out]
        grossCents:
          type: number
        platformFeeCents:
          type: number
        netCents:
          type: number

    EarningsTotals:
      type: object
      required: [pendingCents, paidCents, paidOutCents, lifetimeCents]
      properties:
        pendingCents:
          type: number
        paidCents:
          type: number
        paidOutCents:
          type: number
        lifetimeCents:
          type: number

    EarningsSummary:
      type: object
      required: [connectOnboarded, platformFeeBps, totals, shifts]
      properties:
        connectOnboarded:
          type: boolean
        platformFeeBps:
          type: number
        managerFeeBps:
          type: number
        lifeguardFeeBps:
          type: number
        totals:
          $ref: "#/components/schemas/EarningsTotals"
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/EarningsLineItem"
